# PORT-NEW CI for the Videoclaw reverse/port repo (docs/13-ci.md).
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  port:
    name: port (TS typecheck + tests) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: port
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - run: npm ci
      - name: contract generator determinism
        shell: bash
        run: |
          npm run gen
          git diff --exit-code -- src
          sha1=$(cat src/shared/ipc-contract.ts src/preload/bridge.generated.ts src/main/engine/*.generated.ts src/main/engine/voice-guard.ts | sha256sum)
          npm run gen
          sha2=$(cat src/shared/ipc-contract.ts src/preload/bridge.generated.ts src/main/engine/*.generated.ts src/main/engine/voice-guard.ts | sha256sum)
          test "$sha1" = "$sha2"
      - run: npm run build
      - run: npm test

  engine-static:
    name: engine compat (py_compile + compat tests + import smoke) · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: py_compile engine/tools
        shell: bash
        run: python -m compileall -q engine/tools
      - name: engine compat tests
        run: python tools/test_engine_compat.py
      - name: import smoke (native)
        run: python tools/engine_import_smoke.py posix
      - name: import smoke (simulated windows)
        run: python tools/engine_import_smoke.py winsim
      - name: uv.lock Windows wheel coverage
        run: python tools/check_lock_windows.py
      - name: Windows engine tarball builds
        shell: bash
        run: python tools/make_windows_engine.py "$RUNNER_TEMP/winbundle" | tee "$RUNNER_TEMP/winmanifest.json"

  linux-baseline:
    name: "Linux baseline (real engine, uv sync + doctor + e2e render + Electron smoke)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: system ffmpeg + xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - name: managed CPython 3.14.6
        run: uv python install 3.14.6
      - name: build port
        working-directory: port
        run: npm ci && npm run build
      - name: "tools/linux_baseline.sh (gateway check tolerated, needs credentials)"
        env:
          OUT: ${{ runner.temp }}/linux-run
        run: bash tools/linux_baseline.sh "$RUNNER_TEMP/vc"
      - name: "tools/linux_shell_smoke.sh (headless Electron: bootstrap:run + editorRender end-to-end)"
        run: bash tools/linux_shell_smoke.sh "$RUNNER_TEMP/vc/bootstrap" "$RUNNER_TEMP/vc-shell-home" "$RUNNER_TEMP/linux-run/shell-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-run
          path: ${{ runner.temp }}/linux-run

  windows-runbook:
    # docs/08 S3–S9 on a real Windows x64 runner (tools/windows_runbook.sh) + L0 E1–E15. Blocking since
    # docs/35 (first green run 39716976884); status in docs/13-ci.md §4.
    name: "Windows runbook (docs/08 S3–S9: engine install, uv sync, doctor, e2e, codex handshake)"
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg
        run: command -v ffmpeg || choco install ffmpeg -y --no-progress
      - name: build port
        working-directory: port
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci && npm run build
      - name: tools/windows_runbook.sh
        env:
          OUT: ${{ runner.temp }}\windows-run
        run: |
          # the real binaries, not chocolatey shims (shims resolve their target relative to themselves)
          export PATH="/c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin:$PATH"
          bash tools/windows_runbook.sh "$RUNNER_TEMP/vc"
      # docs/34 M17: S1 level L0 (E1–E15, tools/accept_check.py) on the engine the runbook just installed
      - name: "L0 engine chain E1–E15 (tools/accept_engine_chain.sh, Git Bash)"
        env:
          OUT: ${{ runner.temp }}\windows-run
        run: |
          export PATH="/c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin:$PATH"
          ENG="$(cat "$(cygpath -u "$OUT")/engine-path.txt")"
          bash tools/accept_engine_chain.sh "$ENG" "$RUNNER_TEMP/l0" 2>&1 | tee "$(cygpath -u "$OUT")/l0.log"
          cp "$RUNNER_TEMP/l0/accept.json" "$(cygpath -u "$OUT")/accept-L0.json"
          sha256sum "$RUNNER_TEMP"/l0/ws/jobs/*/final.mp4 | tee "$(cygpath -u "$OUT")/l0-final.sha256"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of json "$RUNNER_TEMP"/l0/ws/jobs/*/final.mp4 | tee "$(cygpath -u "$OUT")/l0-final.ffprobe.json"
      - name: "collect L0 step logs"
        if: always()
        env:
          OUT: ${{ runner.temp }}\windows-run
        run: |
          mkdir -p "$(cygpath -u "$OUT")/l0-steps"
          cp "$RUNNER_TEMP"/l0/step*.log "$RUNNER_TEMP"/l0/verify.log "$(cygpath -u "$OUT")/l0-steps/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-run
          path: ${{ runner.temp }}\windows-run

  windows-package:
    # docs/34 M17 task 2: electron-builder nsis + portable on a real Windows runner, then the packaged smoke
    # (win-unpacked + NSIS silent install). No credentials: the smoke never calls a model.
    name: "Windows package (nsis + portable) + packaged smoke"
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - run: npm ci
      - name: npm run package:win (nsis + portable)
        run: npm run package:win | tee "$RUNNER_TEMP/package-win.json"
      - name: packaged smoke (win-unpacked + NSIS silent install)
        run: |
          ls -la release
          sha256sum release/*.exe | tee "$RUNNER_TEMP/win-artifacts.sha256"
          node tools/packaged-smoke.mjs release/win-unpacked release/*-setup.exe | tee "$RUNNER_TEMP/packaged-smoke-win.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          path: |
            ${{ runner.temp }}/package-win.json
            ${{ runner.temp }}/win-artifacts.sha256
            ${{ runner.temp }}/packaged-smoke-win.json
            port/release/*.exe
          if-no-files-found: warn

  windows-s1-ui:
    # docs/36 M19: acceptance S1 through the ORIGINAL renderer on a real Windows runner, driven over CDP with real
    # input (tools/ui-e2e.mjs --exe): import (drag-and-drop) → agent edit → play via vcmedia:// (W11) → Approve →
    # Download/export → ffprobe + sha (final == v1 == export). The agent is real (packaged Claude Code SDK → Bash/Write
    # → real engine); the MODEL is FAKE-LLM (tools/s1-fake-upstream.mjs, a scripted replay). No key exists in CI.
    # Blocking since it was green twice (runs 39724411939, 39725415137; docs/36). docs/37 M20: + reply_link (W11b)
    # verdict, and the same S1 on the NSIS-installed app (silent per-user install).
    name: "Windows S1 UI e2e (original renderer over CDP, FAKE-LLM)"
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg
        run: command -v ffmpeg || choco install ffmpeg -y --no-progress
      - name: build + package win-unpacked
        working-directory: port
        run: npm ci && npm run build && node tools/package.mjs --platform win --arch x64 --targets dir,nsis
      - name: install the engine (tools/windows_runbook.sh S3–S9)
        env:
          OUT: ${{ runner.temp }}\windows-run
        run: |
          export PATH="/c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin:$PATH"
          bash tools/windows_runbook.sh "$RUNNER_TEMP/vc"
      - name: S1 UI e2e (FAKE-LLM upstream)
        working-directory: port
        env:
          OUT: ${{ runner.temp }}\windows-run
        run: |
          export PATH="/c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin:$PATH"
          ENGW="$(cygpath -w "$(cat "$(cygpath -u "$OUT")/engine-path.txt")")"
          mkdir -p "$RUNNER_TEMP/s1-evidence"
          FAKE_REQ_LOG="$RUNNER_TEMP/s1-evidence/fake-upstream-requests.jsonl" node tools/s1-fake-upstream.mjs 47999 > "$RUNNER_TEMP/s1-evidence/fake-upstream.out" 2>&1 &
          sleep 2
          MINIMAX_API_KEY=fake-s1-ci-key-not-real MINIMAX_BASE_URL=http://127.0.0.1:47999/anthropic \
            node tools/ui-e2e.mjs --run "$(cygpath -w "$RUNNER_TEMP/s1run")" --engine "$ENGW" --exe "$(cygpath -w "$PWD/release/win-unpacked/videoclaw-port.exe")" --port 9371 --turn-timeout-ms 1500000 --taste-wait-ms 60000
      - name: S1 UI e2e on the NSIS-installed app (silent per-user install, docs/37)
        working-directory: port
        env:
          OUT: ${{ runner.temp }}\windows-run
        run: |
          export PATH="/c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin:$PATH"
          ENGW="$(cygpath -w "$(cat "$(cygpath -u "$OUT")/engine-path.txt")")"
          SETUP="$(ls release/*-setup.exe 2>/dev/null | head -n 1)"; [ -n "$SETUP" ] || SETUP="$(ls release/*Setup*.exe | head -n 1)"
          APPDIR="$(cygpath -w "$RUNNER_TEMP/nsis-app")"
          echo "installing $SETUP → $APPDIR"
          MSYS_NO_PATHCONV=1 "$SETUP" /S "/D=$APPDIR"
          ls "$RUNNER_TEMP/nsis-app" | head -n 20
          curl -s -o /dev/null http://127.0.0.1:47999/ || { FAKE_REQ_LOG="$RUNNER_TEMP/s1-evidence/fake-upstream-requests-nsis.jsonl" node tools/s1-fake-upstream.mjs 47999 >> "$RUNNER_TEMP/s1-evidence/fake-upstream.out" 2>&1 & sleep 2; }
          MINIMAX_API_KEY=fake-s1-ci-key-not-real MINIMAX_BASE_URL=http://127.0.0.1:47999/anthropic \
            node tools/ui-e2e.mjs --run "$(cygpath -w "$RUNNER_TEMP/s1run-nsis")" --engine "$ENGW" --exe "$APPDIR\videoclaw-port.exe" --port 9372 --turn-timeout-ms 1500000 --taste-wait-ms 60000
      - name: collect evidence (no media)
        if: always()
        run: |
          E="$RUNNER_TEMP/s1-evidence"; mkdir -p "$E/nsis"
          cp -r "$RUNNER_TEMP/s1run/out/." "$E/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/s1run-nsis/out/." "$E/nsis/" 2>/dev/null || true
          find "$E" \( -name '*.mp4' -o -name '*.mp3' -o -name '*.jpg' -o -name '*.sqlite' \) -delete || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-s1-ui
          path: ${{ runner.temp }}/s1-evidence
          if-no-files-found: warn

  macos-runbook:
    # docs/38 M21: docs/08 S3–S9 on macos-latest (arm64, the original app's native platform) + L0 E1–E15.
    name: "macOS runbook (docs/08 S3–S9: engine install, uv sync, doctor, e2e, codex handshake) + L0"
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg (Homebrew) + managed CPython 3.14.6
        run: |
          command -v ffmpeg || brew install ffmpeg
          uv python install 3.14.6
      - name: build port
        working-directory: port
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci && npm run build
      - name: tools/macos_runbook.sh
        env:
          OUT: ${{ runner.temp }}/macos-run
        run: bash tools/macos_runbook.sh "$RUNNER_TEMP/vc"
      - name: "L0 engine chain E1–E15 (tools/accept_engine_chain.sh)"
        env:
          OUT: ${{ runner.temp }}/macos-run
        run: |
          ENG="$(cat "$OUT/engine-path.txt")"
          bash tools/accept_engine_chain.sh "$ENG" "$RUNNER_TEMP/l0" 2>&1 | tee "$OUT/l0.log"
          cp "$RUNNER_TEMP/l0/accept.json" "$OUT/accept-L0.json"
          shasum -a 256 "$RUNNER_TEMP"/l0/ws/jobs/*/final.mp4 | tee "$OUT/l0-final.sha256"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of json "$RUNNER_TEMP"/l0/ws/jobs/*/final.mp4 | tee "$OUT/l0-final.ffprobe.json"
      - name: "mac-only probe: build the original VoiceDictation.swift helper, --check, transcribe a `say` clip (docs/38 §3)"
        continue-on-error: true
        env:
          OUT: ${{ runner.temp }}/macos-run
        run: |
          set -x
          swiftc -version 2>&1 | tee "$OUT/voice-swiftc.txt"
          swiftc -parse-as-library -O app/native/VoiceDictation.swift -o "$RUNNER_TEMP/voice-dictation" 2>&1 | tee -a "$OUT/voice-swiftc.txt"
          "$RUNNER_TEMP/voice-dictation" --check | tee "$OUT/voice-check.json"; echo
          say -o "$RUNNER_TEMP/hello.aiff" "Make a vertical video from my three clips"
          ffmpeg -loglevel error -y -i "$RUNNER_TEMP/hello.aiff" -ar 48000 -ac 1 "$RUNNER_TEMP/hello.wav"
          (perl -e 'alarm 300; exec @ARGV' "$RUNNER_TEMP/voice-dictation" "$RUNNER_TEMP/hello.wav" || true) | tee "$OUT/voice-transcribe.json"; echo
          cd port && VIDEOCLAW_TEST_VOICE_HELPER="$RUNNER_TEMP/voice-dictation" node tools/build.mjs --tests >/dev/null && VIDEOCLAW_TEST_VOICE_HELPER="$RUNNER_TEMP/voice-dictation" node --test dist-test/mac-voice-helper.test.cjs 2>&1 | tee "$OUT/voice-port-status.txt"
      - name: collect L0 step logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/macos-run/l0-steps"
          cp "$RUNNER_TEMP"/l0/step*.log "$RUNNER_TEMP"/l0/verify.log "$RUNNER_TEMP/macos-run/l0-steps/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-run
          path: ${{ runner.temp }}/macos-run

  macos-s1-ui:
    # docs/38 M21: acceptance S1 through the ORIGINAL renderer in the packaged .app (arm64) over CDP — the same
    # verdicts as windows-s1-ui (attach → agent edit → reply_link → play via vcmedia:// → Approve → export → sha +
    # ffprobe). Agent real (packaged Claude Code SDK → Bash/Write → real engine), MODEL = FAKE-LLM replay. No key in CI.
    name: "macOS S1 UI e2e (packaged .app, original renderer over CDP, FAKE-LLM)"
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg (Homebrew) + managed CPython 3.14.6
        run: |
          command -v ffmpeg || brew install ffmpeg
          uv python install 3.14.6
      - name: build + package .app (dir)
        working-directory: port
        run: npm ci && npm run build && node tools/package.mjs --platform mac --arch arm64 --targets dir
      - name: install the engine (tools/macos_runbook.sh)
        env:
          OUT: ${{ runner.temp }}/macos-run
        run: bash tools/macos_runbook.sh "$RUNNER_TEMP/vc"
      - name: S1 UI e2e (FAKE-LLM upstream)
        working-directory: port
        env:
          OUT: ${{ runner.temp }}/macos-run
        run: |
          ENG="$(cat "$OUT/engine-path.txt")"
          APP="$(ls -d release/mac*/*.app | head -n 1)"; echo "app: $APP"
          mkdir -p "$RUNNER_TEMP/s1-evidence"
          FAKE_REQ_LOG="$RUNNER_TEMP/s1-evidence/fake-upstream-requests.jsonl" node tools/s1-fake-upstream.mjs 47999 > "$RUNNER_TEMP/s1-evidence/fake-upstream.out" 2>&1 &
          sleep 2
          MINIMAX_API_KEY=fake-s1-ci-key-not-real MINIMAX_BASE_URL=http://127.0.0.1:47999/anthropic \
            node tools/ui-e2e.mjs --run "$RUNNER_TEMP/s1run" --engine "$ENG" --exe "$APP" --port 9371 --turn-timeout-ms 1500000 --taste-wait-ms 60000
      - name: collect evidence (no media)
        if: always()
        run: |
          E="$RUNNER_TEMP/s1-evidence"; mkdir -p "$E"
          cp -R "$RUNNER_TEMP/s1run/out/." "$E/" 2>/dev/null || true
          find "$E" \( -name '*.mp4' -o -name '*.mp3' -o -name '*.jpg' -o -name '*.sqlite' \) -delete || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-s1-ui
          path: ${{ runner.temp }}/s1-evidence
          if-no-files-found: warn

  macos-native:
    # docs/39 M22: the original's macOS-native paths on macos-latest — PDFKit PDF reading via /usr/bin/osascript
    # (readOwnedPdf L56967), the voice-dictation helper built from app/native/VoiceDictation.swift and shipped in
    # the .app at Contents/Resources/bootstrap (the original layout) + VoiceDictation.execute up to Apple's speech
    # assets, and the hidden staging Flight profile's setActivationPolicy("accessory") in a real Electron.
    name: "macOS native (PDFKit reader, packaged voice-dictation helper, Flight accessory policy)"
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - name: ffmpeg (Homebrew)
        run: command -v ffmpeg || brew install ffmpeg
      - name: build + package .app (dir, no SDK) — builds resources/bootstrap/voice-dictation
        working-directory: port
        run: npm ci && npm run build && node tools/package.mjs --platform mac --arch arm64 --targets dir --no-sdk
      - name: packaged helper layout + --check
        working-directory: port
        run: |
          set -x
          OUT="$RUNNER_TEMP/macos-native"; mkdir -p "$OUT"
          APP="$(ls -d release/mac*/*.app | head -n 1)"; H="$APP/Contents/Resources/bootstrap/voice-dictation"
          test -x "$H"
          { echo "app: $(basename "$APP")"; ls -l "$APP/Contents/Resources/bootstrap"; file "$H"; lipo -archs "$H"; otool -l "$H" | grep -A4 LC_BUILD_VERSION | head -n 6; codesign -dv "$H" 2>&1 | grep -E "Signature|Identifier|flags" || true; } | tee "$OUT/helper-layout.txt"
          "$H" --check | tee "$OUT/helper-check.json"; echo
          echo "$PWD/$H" > "$RUNNER_TEMP/helper-path.txt"
      - name: "PDFKit reader + VoiceDictation tests (real osascript, real packaged helper, a `say` recording)"
        working-directory: port
        run: |
          OUT="$RUNNER_TEMP/macos-native"
          say -o "$RUNNER_TEMP/note.aiff" "Make a vertical video from my three clips"
          ffmpeg -nostdin -v error -y -i "$RUNNER_TEMP/note.aiff" -c:a libopus -f webm "$RUNNER_TEMP/note.webm"
          node tools/build.mjs --tests >/dev/null
          VIDEOCLAW_TEST_PDFKIT=1 VIDEOCLAW_TEST_VOICE_HELPER="$(cat "$RUNNER_TEMP/helper-path.txt")" VIDEOCLAW_TEST_VOICE_WEBM="$RUNNER_TEMP/note.webm" \
            node --test dist-test/pdf-reader.test.cjs dist-test/voice-dictation.test.cjs dist-test/mac-voice-helper.test.cjs dist-test/staging-flight.test.cjs 2>&1 | tee "$OUT/native-tests.txt"
          ! grep -q "^not ok" "$OUT/native-tests.txt"
          grep -q "^# fail 0" "$OUT/native-tests.txt"
      - name: "real Electron: hidden staging Flight → accessory activation policy (Dock hidden) vs control"
        working-directory: port
        run: |
          OUT="$RUNNER_TEMP/macos-native"
          npx esbuild tools/m22-flight-probe.ts --bundle --platform=node --format=cjs --external:electron --outfile="$RUNNER_TEMP/flight-probe.cjs"
          VIDEOCLAW_FLIGHT_HIDDEN=1 perl -e 'alarm 120; exec @ARGV' npx electron "$RUNNER_TEMP/flight-probe.cjs" 2>&1 | grep FLIGHT_PROBE | tee "$OUT/flight-hidden.txt"
          perl -e 'alarm 120; exec @ARGV' npx electron "$RUNNER_TEMP/flight-probe.cjs" 2>&1 | grep FLIGHT_PROBE | tee "$OUT/flight-control.txt"
          node -e '
            const fs = require("fs"); const r = (f) => JSON.parse(fs.readFileSync(f, "utf8").replace(/^FLIGHT_PROBE /, ""));
            const h = r(process.argv[1]), c = r(process.argv[2]);
            const ok = h.hidden && h.dockVisible === false && h.windowVisible === false && h.backgroundThrottling === false && h.userDataIsFlight && h.cdpAddress === "127.0.0.1"
              && !c.hidden && c.dockVisible === true && c.windowVisible === true && c.backgroundThrottling === true && c.userDataIsFlight;
            console.log(JSON.stringify({ ok, hidden: h, control: c })); process.exit(ok ? 0 : 1);' "$OUT/flight-hidden.txt" "$OUT/flight-control.txt" | tee "$OUT/flight-verdict.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native
          path: ${{ runner.temp }}/macos-native

  macos-package:
    # docs/34 M17: the cheap macOS leg — unsigned dmg (identity: null). docs/36 M19: plus the packaged smoke on the
    # .app bundle (GUI boot + node-mode SDK/sqlite checks; never calls a model).
    name: "macOS package (dmg, unsigned) + packaged smoke"
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: port/package-lock.json
      - run: npm ci
      - run: npm run package:mac | tee "$RUNNER_TEMP/package-mac.json"
      - run: ls -la release; shasum -a 256 release/*.dmg | tee "$RUNNER_TEMP/mac-artifacts.sha256"
      - name: packaged smoke (.app bundle, docs/36 M19)
        run: |
          APP="$(ls -d release/mac*/*.app | head -n 1)"
          echo "smoke target: $APP"
          node tools/packaged-smoke.mjs "$APP" | tee "$RUNNER_TEMP/packaged-smoke-mac.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-package
          path: |
            ${{ runner.temp }}/package-mac.json
            ${{ runner.temp }}/mac-artifacts.sha256
            ${{ runner.temp }}/packaged-smoke-mac.json
          if-no-files-found: warn
